name: Sync global issue board

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: scnu-global-issue-board
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check dedicated project credential
        id: credential
        env:
          APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '自动同步尚未启用：请配置 GH_APP_CLIENT_ID（Variable）和 GH_APP_PRIVATE_KEY（Secret），并将 App 安装到组织全部仓库。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Validate synchronization code and public log privacy
        run: |
          python3 -m py_compile scripts/global-project-sync.py
          python3 -m unittest discover -s tests -v
      - name: Create short-lived GitHub App installation token
        if: steps.credential.outputs.ready == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: SCNUAutoPtr
          permission-issues: read
          permission-organization-projects: write
      - name: Sync organization issues and relationships
        if: steps.credential.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/global-project-sync.py
